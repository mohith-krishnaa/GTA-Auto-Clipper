name: General clipper validation

on:
  pull_request:
    paths:
      - "general_clipper/**"
  push:
    branches:
      - "feature/general-ai-clipper"
    paths:
      - "general_clipper/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: general_clipper
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validation tests
        run: python -m unittest discover -s tests -v
